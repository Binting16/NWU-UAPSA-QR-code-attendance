<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B6E4F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QR Code Attendance - NWU UAPSA</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Core Theme Stylesheet -->
  <link rel="stylesheet" href="./src/styles/theme.css">

  <!-- Import Map for Native ES Modules -->
  <script type="importmap">
  {
    "imports": {
      "lit": "./lib/lit-core.min.js"
    }
  }
  </script>

  <!-- Offline-First Libraries with Automatic CDN Fallback -->
  <script>
    (function() {
      function loadScript(src) {
        return new Promise(function(resolve, reject) {
          const s = document.createElement('script');
          s.src = src;
          s.onload = function() { resolve(true); };
          s.onerror = function() { reject(new Error('Failed to load ' + src)); };
          document.head.appendChild(s);
        });
      }

      function ensureLibrary(localSrc, cdnSrc, checkFn) {
        return loadScript(localSrc)
          .then(function() {
            if (checkFn()) return true;
            throw new Error('Local verification failed');
          })
          .catch(function() {
            console.warn('Local asset (' + localSrc + ') failed, loading CDN fallback: ' + cdnSrc);
            return loadScript(cdnSrc).then(checkFn).catch(function() { return false; });
          });
      }

      window.__appLibsReady = Promise.all([
        ensureLibrary('lib/html5-qrcode.min.js', 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js', function() {
          return typeof Html5Qrcode !== 'undefined';
        }),
        ensureLibrary('lib/xlsx.bundle.js', 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js', function() {
          return typeof XLSX !== 'undefined';
        })
      ]);
    })();
  </script>

  <!-- Application Shell -->
  <script type="module" src="./src/app-root.js"></script>
</head>
<body>
  <!-- Root Lit Application Host -->
  <app-root></app-root>
</body>
</html>
