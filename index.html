<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B6E4F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QR Code Attendance - NWU UAPSA</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Core Theme Stylesheet -->
  <link rel="stylesheet" href="./src/styles/theme.css">

  <!-- Import Map for Native ES Modules -->
  <script type="importmap">
  {
    "imports": {
      "lit": "./lib/lit-core.min.js"
    }
  }
  </script>

  <!-- Client libraries: try local copy first, then CDN (changing a script's src in onerror does NOT reload it) -->
  <script>
    (function () {
      function load(sources, done) {
        var i = 0;
        (function next() {
          if (i >= sources.length) return done && done(false);
          var s = document.createElement('script');
          s.src = sources[i++];
          s.onload = function () { done && done(true); };
          s.onerror = function () { s.remove(); next(); };
          document.head.appendChild(s);
        })();
      }
      load(['./lib/html5-qrcode.min.js', 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js', 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js']);
      load(['./lib/xlsx.bundle.js', 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js']);
    })();
  </script>

  <!-- Application Shell -->
  <script type="module" src="./src/app-root.js"></script>
</head>
<body>
  <!-- Root Lit Application Host -->
  <app-root></app-root>
</body>
</html>
